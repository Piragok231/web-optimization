<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Прекрасные места мира</title>
    <style>
        /* Базовые настройки для всей страницы */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f7f9fa;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Стиль главного заголовка */
        h1 {
            color: #2c3e50;
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 30px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }

        /* Стиль абзацев текста */
        p {
            font-size: 1.1rem;
            margin: 20px 0 10px 0;
            color: #555;
        }

        /* Стили для адаптивных изображений */
        img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
            display: block;
            margin-bottom: 25px;
        }

        /* Эффект при наведении на картинку */
        img:hover {
            transform: scale(1.02);
        }

        /* Стиль ссылки, оформленной как кнопка */
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background-color: #3498db;
            color: #fff;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
            text-align: center;
        }

        /* Эффект при наведении на кнопку-ссылку */
        a:hover {
            background-color: #2980b9;
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
        }
    </style>
</head>
<body>
    <h1>Путешествия, меняющие жизнь</h1>
    <p>Путешествия открывают перед нами новые горизонты и позволяют увидеть мир с совершенно иной стороны.</p>
    
    <img src="images/nature1.jpg" alt="Главное фото">

    <p>Посещая новые страны, мы учимся лучше понимать самих себя.</p>
    <img src="images/nature2.jpg" alt="Красивый пейзаж">

    <p>Планирование поездки — это всегда предвкушение приключения.</p>
    <img src="images/nature3.jpg" alt="Архитектура города">
    
    <div style="text-align: center;">
        <a href="https://github.com" target="_blank">Узнать больше</a>
    </div>
</body>
</html>
